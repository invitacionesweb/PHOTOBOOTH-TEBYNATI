<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
<style>

  @font-face {
    font-family: 'Boulangerie';
    src: url('BoulangerieCaps.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'WhisperMelody';
    src: url('WhisperMelodyLight-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  /* ============================================
     🎨 COLORES — cambiá los de acá abajo nomás
     ============================================ */
  :root{
    --color-0: #ffffff; /* blanco */
    --color-1: #000000; /* oscuro */
    --color-2: #721423; /* fondo / botones secundarios */
    --color-3: #104B9C;
    --color-4: #8A8E6C; /* color principal de botones */
    --font: 'Schoolbell', cursive;
    --font-titulos: 'Boulangerie', cursive;
    --font-botones: 'WhisperMelody', cursive;
    --radius: 20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100vw;height:100vh;overflow:hidden;font-family:var(--font);background:var(--color-0) url('textura.png');}
  #app{width:100%;max-width:430px;height:100vh;margin:0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .screen{display:none;flex-direction:column;position:absolute;inset:0;background-size:cover;background-position:top center;background-repeat:no-repeat;}
  .screen.active{display:flex;}

  /* Screen 1 */
  #screen-1{background-image:var(--bg1);justify-content:flex-end;padding:0 28px 144px;}
  .content{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;}
  .tagline{font-family:var(--font-titulos);font-size:28px;color:var(--color-1);text-align:center;line-height:1.3;}
  .format-label{font-size:19px;color:var(--color-1);}
  .layout-options{display:flex;gap:14px;width:100%;}.layout-options .layout-card{min-height:160px;}
  .layout-card{flex:1;background:rgba(255,255,255,.75);border-radius:var(--radius);border:2.5px solid transparent;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-color .2s,background .2s;}
  .layout-card.selected{border-color:var(--color-4);background:rgba(255,255,255,.95);}
  .layout-preview{width:44px;display:flex;flex-direction:column;gap:4px;}
  .layout-preview.strip div{width:100%;aspect-ratio:1;background:var(--color-2);border-radius:4px;}
  .layout-preview.grid{width:88px;height:88px;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 auto;}
  .layout-preview.grid div{aspect-ratio:1;background:var(--color-2);border-radius:4px;}
  .layout-card span{font-family:var(--font-botones);font-size:13px;color:var(--color-1);}
  .btn{width:100%;padding:15px;border-radius:50px;border:none;background:var(--color-4);color:var(--color-0);font-family:var(--font-botones);font-size:22px;cursor:pointer;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.97);opacity:.9;}

  /* Screen 2 */
  #screen-2{background-image:var(--bg2);padding:44px 24px 28px;gap:14px;align-items:center;justify-content:center;}
  .cam-header{width:100%;display:flex;justify-content:space-between;align-items:center;}
  .cam-title{font-family:var(--font-titulos);font-size:28px;color:var(--color-2);}
  .flip-btn{width:38px;height:38px;border-radius:50%;background:var(--color-2);color:var(--color-0);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .camera-wrap{position:relative;width:100%;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;background:#111;flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,.2);}
  #video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .screen-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;}
  .countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-titulos);font-size:100px;color:#fff;pointer-events:none;opacity:0;}
  .shots-progress{display:flex;gap:10px;justify-content:center;}
  .dot-shot{width:14px;height:14px;border-radius:50%;border:2px solid var(--color-2);background:transparent;transition:background .2s;}
  .dot-shot.done{background:var(--color-2);}
  .shutter{width:72px;height:72px;border-radius:50%;background:var(--color-0);border:4px solid var(--color-2);box-shadow:0 0 0 2px var(--color-0);cursor:pointer;flex-shrink:0;transition:transform .1s;}
  .shutter:active{transform:scale(.93);}
  .cam-hint{font-size:15px;color:var(--color-2);text-align:center;}

  /* Screen 3 — resultado */
  #screen-3{background-color:var(--color-2);justify-content:center;padding:28px 28px 30px;gap:12px;align-items:center;}
  .final-frame{width:62%;border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25);flex-shrink:0;}
  #finalImg{width:100%;display:block;}
  #screen-3 h2{font-family:var(--font-titulos);font-size:28px;color:var(--color-0);}
  .btn-outline{background:transparent;border:2px solid rgba(255,255,255,.7);}
  .final-text{text-align:center;}
  .final-text p{font-size:17px;color:var(--color-0);line-height:1.3;margin-top:4px;}
  .final-btns{display:flex;flex-direction:column;gap:10px;width:100%;}
  .share-hint{font-size:13px;color:rgba(255,255,255,.85);text-align:center;min-height:18px;}
  .redo{font-family:var(--font-botones);font-size:16px;color:rgba(255,255,255,.8);background:none;border:none;cursor:pointer;text-decoration:underline;text-align:center;}

</style>
</head>
<body>
<div id="app" style="
  --bg1: url('fondos/fondo-inicio.png');
  --bg2: url('fondos/fondo-camara.png');
">
  <div class="screen-flash" id="screenFlash"></div>

  <section class="screen active" id="screen-1">
    <div class="content">
      <p class="tagline">¡Llevate un recuerdo <br> de esta noche! 📸
</p>
      <p class="format-label">Elegí el formato</p>
      <div class="layout-options">
        <div class="layout-card selected" data-layout="strip" onclick="selectLayout('strip')">
          <div class="layout-preview strip"><div></div><div></div><div></div></div>
          <span>Tira de 3</span>
        </div>
        <div class="layout-card" data-layout="grid" onclick="selectLayout('grid')">
          <div class="layout-preview grid"><div></div><div></div><div></div><div></div></div>
          <span>Grilla 2×2</span>
        </div>
      </div>
      <button class="btn" onclick="goToCamera()">¡Empezar! ✨</button>
    </div>
  </section>

  <section class="screen" id="screen-2">
    <div class="cam-header">
      <span class="cam-title">¡Sonrían!</span>
      <button class="flip-btn" onclick="switchCamera()">⟲</button>
    </div>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="flash" id="flash"></div>
      <div class="countdown" id="countdown">3</div>
    </div>
    <div class="shots-progress" id="shotsProgress"></div>
    <div class="shutter" id="shutterBtn" onclick="startCountdown()"></div>
    <p class="cam-hint" id="camHint">Tocá el círculo para sacar la foto</p>
  </section>

  <section class="screen" id="screen-3">
    <div class="final-frame"><img id="finalImg" alt="tu foto"></div>
    <div class="final-text">
      <h2>¡Fotones!</h2>
      <p>No olvides compartirla en redes<br>y etiquetarnos</p>
    </div>
    <div class="final-btns">
      <button class="btn" onclick="savePhoto()">Guardar en mi celu 📲</button>
      <a class="btn btn-outline" id="followBtn" target="_blank" rel="noopener">Seguinos en redes</a>
    </div>
    <div class="share-hint" id="shareHint"></div>
    <button class="redo" onclick="restart()">Sacar otra foto</button>
  </section>

  <canvas id="hiddenCapture" style="display:none"></canvas>
  <canvas id="composeCanvas" style="display:none"></canvas>
</div>
<script>

// ============================================
// ⚙️ CONFIGURACIÓN — editá solo esto para cada cliente
// ============================================
const CONFIG = {
  // Nombre de los novios (aparece en el título y en el nombre del archivo de la foto)
  novios: 'Lolo y Maca',

  // Instagram al que lleva el botón "Seguinos en redes".
  // Poné solo el usuario, sin @ (ej: 'loloymaca')
  instagram: 'loloymaca',

  // Imágenes de fondo: están en la carpeta "fondos/" al lado de este archivo.
  bgFoto:     'fondos/fondo-foto-tira.png',   // fondo cuando se elige "Tira de 3"
  bgFotoGrid: 'fondos/fondo-foto-grilla.png', // fondo cuando se elige "Grilla 2x2"
};

document.title = 'Photobooth · ' + CONFIG.novios;
document.getElementById('followBtn').href =
  'https://www.instagram.com/' + CONFIG.instagram.replace('@','').trim() + '/';

// Convierte "Lau y Nacho" en "lau-y-nacho" para usarlo en nombres de archivo
function slug(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-');
}

const CW = 1080, CH = 1920, PAD = 34;
let layout = 'strip', shotsNeeded = 3, shotsTaken = [];
let stream = null, facingMode = 'user', counting = false;
const bgCache = { strip:{status:'idle', img:null}, grid:{status:'idle', img:null} };
const photoCache = {};

// Shared square size so strip and grid look the same
function squareSize() {
  const byWidth  = (CW - PAD * 3) / 2;   // max for 2 cols (grid)
  const byHeight = (CH - PAD * 4) / 3;   // max for 3 rows (strip)
  return Math.min(byWidth, byHeight);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectLayout(l) {
  layout = l;
  document.querySelectorAll('.layout-card').forEach(c =>
    c.classList.toggle('selected', c.dataset.layout === l)
  );
}

async function goToCamera() {
  shotsNeeded = layout === 'strip' ? 3 : 4;
  shotsTaken = [];
  renderProgress();
  document.getElementById('camHint').textContent = 'Tocá el círculo para sacar la foto';
  showScreen('screen-2');
  facingMode = 'user';
  await startCamera();
}

async function startCamera() {
  if(stream) stream.getTracks().forEach(t => t.stop());
  const video = document.getElementById('video');
  video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode }, audio:false });
    video.srcObject = stream;
  } catch(err) {
    document.getElementById('camHint').textContent = 'No pudimos acceder a la cámara 😕';
  }
}

async function switchCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  await startCamera();
}

function renderProgress() {
  const el = document.getElementById('shotsProgress');
  el.innerHTML = Array.from({length:shotsNeeded}, (_,i) =>
    '<div class="dot-shot ' + (i < shotsTaken.length ? 'done' : '') + '"></div>'
  ).join('');
}

function startCountdown() {
  if(counting) return;
  counting = true;
  document.getElementById('shutterBtn').style.opacity = '.4';
  const cd = document.getElementById('countdown');
  let n = 3;
  cd.style.opacity = 1;
  cd.textContent = n;
  const iv = setInterval(() => {
    n--;
    if(n > 0) { cd.textContent = n; }
    else {
      clearInterval(iv);
      cd.style.opacity = 0;
      capturePhoto();
      counting = false;
      document.getElementById('shutterBtn').style.opacity = '1';
    }
  }, 900);
}

function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('hiddenCapture');
  const size = Math.min(video.videoWidth, video.videoHeight);
  canvas.width = 600; canvas.height = 600;
  const ctx = canvas.getContext('2d');
  const sx = (video.videoWidth - size)/2;
  const sy = (video.videoHeight - size)/2;
  ctx.save();
  if(facingMode === 'user') { ctx.translate(600,0); ctx.scale(-1,1); }
  ctx.drawImage(video, sx, sy, size, size, 0, 0, 600, 600);
  ctx.restore();

  shotsTaken.push(canvas.toDataURL('image/jpeg', 0.92));

  const flash = document.getElementById('flash');
  flash.style.transition='none'; flash.style.opacity=.85;
  requestAnimationFrame(() => { flash.style.transition='opacity .35s'; flash.style.opacity=0; });
  const sf = document.getElementById('screenFlash');
  sf.style.transition='none'; sf.style.opacity=1;
  requestAnimationFrame(() => { sf.style.transition='opacity .45s'; sf.style.opacity=0; });
  if(navigator.vibrate) navigator.vibrate(40);

  renderProgress();
  if(shotsTaken.length < shotsNeeded) {
    document.getElementById('camHint').textContent = 'Foto ' + (shotsTaken.length+1) + ' de ' + shotsNeeded + ' 📸';
  } else {
    // Última foto: apagamos la cámara y vamos directo al resultado
    if(stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('camHint').textContent = 'Armando tu foto... ✨';
    buildComposite();
    goToFinal();
  }
}

// ---- COMPOSITE ----
let compositeReady = false;

function buildComposite() {
  const canvas = document.getElementById('composeCanvas');
  canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,CW,CH);

  const cache = bgCache[layout];
  const src = layout === 'grid' ? CONFIG.bgFotoGrid : CONFIG.bgFoto;

  if(cache.status === 'ready') {
    ctx.drawImage(cache.img, 0, 0, CW, CH);
    drawPhotos(ctx);
  } else if(cache.status === 'error') {
    // Sin fondo igual armamos la foto sobre blanco
    drawPhotos(ctx);
  } else if(cache.status !== 'loading') {
    cache.status = 'loading';
    const img = new Image();
    img.onload = () => { cache.img=img; cache.status='ready'; buildComposite(); };
    img.onerror = () => { console.error('No se pudo cargar el fondo:', src); cache.status='error'; buildComposite(); };
    img.src = src;
  }
}

function drawPhotos(ctx) {
  const size = squareSize();
  let allDrawn = true;
  if(layout === 'strip') {
    const stripSize = size * 0.798;
    const totalH = stripSize*3 + PAD*2;
    const startY = (CH - totalH)/2;
    const x = (CW - stripSize)/2;
    shotsTaken.forEach((src,i) => {
      if(!drawSlot(ctx, src, x, startY + i*(stripSize+PAD), stripSize, stripSize)) allDrawn = false;
    });
  } else {
    const gridSize = size * 0.96;
    const totalW = gridSize*2 + PAD;
    const totalH = gridSize*2 + PAD;
    const startX = (CW - totalW)/2;
    const startY = (CH - totalH)/2;
    shotsTaken.forEach((src,i) => {
      const col=i%2, row=Math.floor(i/2);
      if(!drawSlot(ctx, src, startX+col*(gridSize+PAD), startY+row*(gridSize+PAD), gridSize, gridSize)) allDrawn = false;
    });
  }
  compositeReady = allDrawn;
}

function drawSlot(ctx, src, x, y, w, h) {
  if(!photoCache[src]) {
    const img = new Image();
    img.onload = () => { photoCache[src]=img; buildComposite(); };
    img.src = src;
    photoCache[src] = 'loading';
    return false;
  }
  if(photoCache[src] === 'loading') return false;
  const img = photoCache[src];
  ctx.save();
  const r = 18;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath(); ctx.clip();
  const ir=img.width/img.height, tr=w/h;
  let sx,sy,sw,sh;
  if(ir>tr){ sh=img.height; sw=sh*tr; sx=(img.width-sw)/2; sy=0; }
  else{ sw=img.width; sh=sw/tr; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
  ctx.restore();
  return true;
}

// ---- FINAL ----
function goToFinal() {
  // Esperamos a que la foto termine de armarse (fondo + fotos cargadas)
  if(!compositeReady) {
    setTimeout(goToFinal, 150);
    return;
  }
  try {
    const dataUrl = document.getElementById('composeCanvas').toDataURL('image/jpeg', 0.92);
    document.getElementById('finalImg').src = dataUrl;
  } catch(err) {
    // Pasa si el archivo se abre con doble click (file://) en vez de servirse desde
    // un servidor: el canvas queda "tainted" y toDataURL falla.
    console.error('No se pudo exportar la foto final:', err);
  }
  showScreen('screen-3');
}

// ---- GUARDAR EN EL CELU ----
// iPhone: abre el menú del sistema → "Guardar imagen" (va directo a Fotos).
// Android / compu: descarga el archivo (aparece en Galería / Descargas).
async function savePhoto() {
  const hintEl = document.getElementById('shareHint');
  const dataUrl = document.getElementById('finalImg').src;
  const nombre = 'photobooth-' + slug(CONFIG.novios) + '.jpg';
  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], nombre, {type:'image/jpeg'});
    const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if(esIOS && navigator.canShare && navigator.canShare({files:[file]})) {
      hintEl.textContent = 'Tocá "Guardar imagen" y queda en tus Fotos 📸';
      await navigator.share({ files:[file] });
      hintEl.textContent = '';
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    hintEl.textContent = '¡Guardada! Buscala en tu galería 📁';
  } catch(err) {
    if(err && err.name === 'AbortError') { hintEl.textContent = ''; return; }
    hintEl.textContent = 'No pudimos guardarla, probá de nuevo 🙏';
  }
}

// ---- COMPARTIR EN INSTAGRAM ----
async function shareInstagram() {
  const hintEl = document.getElementById('shareHint');
  const dataUrl = document.getElementById('finalImg').src;
  const textoCompartir = 'Fotito de la boda de ' + CONFIG.novios + ' 💍 ' + ETIQUETAS;

  // Copiamos las etiquetas para que solo tengan que pegarlas en la historia
  try { await navigator.clipboard.writeText(ETIQUETAS); } catch(e) {}

  try {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], 'photobooth-' + slug(CONFIG.novios) + '.jpg', {type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})) {
      hintEl.textContent = '¡Etiquetas copiadas! Pegalas en tu historia 💛';
      await navigator.share({ files:[file], title:'Photobooth · ' + CONFIG.novios, text: textoCompartir });
      return;
    }
  } catch(err) {
    if(err && err.name === 'AbortError') return; // cerraron el menú de compartir
  }
  // Si el navegador no tiene menú de compartir: guardamos la foto y abrimos Instagram
  await savePhoto();
  hintEl.textContent = 'Subila desde tu galería y pegá ' + ETIQUETAS + ' 💛';
  setTimeout(() => { window.location.href = 'instagram://camera'; }, 800);
}

function restart() {
  shotsTaken = [];
  compositeReady = false;
  document.getElementById('shareHint').textContent = '';
  document.getElementById('camHint').textContent = 'Tocá el círculo para sacar la foto';
  document.getElementById('finalImg').removeAttribute('src');
  Object.keys(photoCache).forEach(k => delete photoCache[k]);
  showScreen('screen-1');
}

</script>
</body>
</html>
